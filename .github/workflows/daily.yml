name: daily-primety
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Приметы
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LABEL: "🔮 Приметы · "
      - name: Русскоязычные шорты
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          QUERY_LIST: "*"
          DAYS: "1"
          YT_REGION: ""
          YT_LANG: "ru"
          REPORT_FILE: report-ru.html
          LABEL: "🇷🇺 Русскоязычные · "
      - name: Шорты со всего мира
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          QUERY_LIST: "*"
          DAYS: "1"
          YT_REGION: ""
          YT_LANG: ""
          ANY_LANG: "1"
          REPORT_FILE: report-world.html
          LABEL: "🌍 Весь мир · "
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report.html
            report-ru.html
            report-world.html
