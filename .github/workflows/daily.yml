name: daily-primety
on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Пропустить автозапуск, если сегодня уже запускали вручную
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "${{ github.repository }}" --workflow daily.yml --event workflow_dispatch --status success --created ">=$(date -u +%F)" --json databaseId --jq length)
          echo "Ручных успешных запусков сегодня: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Приметы на русском
        if: steps.check.outputs.skip != 'true'
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LABEL: "🔮 Приметы (RU) · "
          REPORT_FILE: report-primety.html
            - name: Мудрость и психология на русском
        if: steps.check.outputs.skip != 'true'
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          QUERY_LIST: "цитаты о жизни|психология отношений|мудрость жизни|мотивация и дисциплина|стоицизм"
          DAYS: "3"
          LABEL: "💭 Мудрость (RU) · "
          REPORT_FILE: report-wisdom-ru.html
      - name: Мудрость и психология по всему миру
        if: steps.check.outputs.skip != 'true'
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          QUERY_LIST: "life quotes|psychology facts|life wisdom|stoicism|motivation discipline"
          DAYS: "3"
          YT_REGION: ""
          YT_LANG: "en"
          ANY_LANG: "1"
          LABEL: "💭 Wisdom (world) · "
          REPORT_FILE: report-wisdom-world.html
        if: steps.check.outputs.skip != 'true'
        with:
          name: reports
          path: |
            report-primety.html
            report-world-omens.html
