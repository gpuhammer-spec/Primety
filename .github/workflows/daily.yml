name: daily-primety
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Приметы на русском
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LABEL: "🔮 Приметы (RU) · "
          REPORT_FILE: report-primety.html
      - name: Приметы по всему миру
        run: python primety_scanner.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          QUERY_LIST: "superstitions|bad luck superstitions|folk omens and beliefs|evil eye protection|lucky charms|old wives tales"
          DAYS: "7"
          YT_REGION: ""
          YT_LANG: ""
          ANY_LANG: "1"
          LABEL: "🌍 Приметы мира · "
          REPORT_FILE: report-world-omens.html
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report-primety.html
            report-world-omens.html
